name: Publiceren

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Nooit twee publicaties tegelijk: de nieuwste wint.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  bouwen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Site klaarzetten voor GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publiceren:
    needs: bouwen
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publicatie.outputs.page_url }}
    steps:
      - name: Site publiceren op GitHub Pages
        id: publicatie
        uses: actions/deploy-pages@v4
