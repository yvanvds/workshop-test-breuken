<!doctype html>
<html lang="nl">
<head><meta charset="utf-8"><title>ChoiceQuestion: voorbeeld</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>if (new URLSearchParams(location.search).get('theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark');</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../bundle.css">
<script src="../bundle.js"></script>
<style>body{padding:16px;background:var(--bg)}</style></head>
<body class="ai-root">
<div class="ai-choice" data-ai-choice data-mode="check">
  <div class="ai-choice__opts" role="group" aria-label="Antwoorden">
    <button type="button" class="ai-option"><span class="ai-option__key">A</span><span>Eerste antwoord</span></button>
    <button type="button" class="ai-option" data-correct="true"><span class="ai-option__key">B</span><span>Tweede antwoord</span></button>
    <button type="button" class="ai-option"><span class="ai-option__key">C</span><span>Derde antwoord</span></button>
  </div>
  <div class="ai-feedback ai-feedback--correct" hidden role="status"><span class="ai-feedback__icon"><svg class="ai-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span><div class="ai-feedback__body"><p class="ai-feedback__title">Juist</p><p>Korte uitleg waarom dit antwoord klopt.</p></div></div>
  <div class="ai-feedback ai-feedback--wrong" hidden role="status"><span class="ai-feedback__icon"><svg class="ai-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></span><div class="ai-feedback__body"><p class="ai-feedback__title">Niet juist</p><p>Korte uitleg waarom dit antwoord niet klopt.</p></div></div>
  <div class="ai-choice__actions"><button type="button" class="ai-btn ai-btn--secondary" data-ai-check>Controleer</button></div>
</div>
<script>window.ArcadiaAI && window.ArcadiaAI.init();</script>
</body>
</html>
